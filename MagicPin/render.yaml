# Render Blueprint for Vera Reforged.
# Deploy: push this repo to GitHub, then in Render → New → Blueprint → pick this repo.
# Render builds/runs from the bot/ subdirectory (rootDir) using the native Python runtime.
services:
  - type: web
    name: vera-reforged
    runtime: python
    plan: free                       # free spins down after ~15 min idle (cold start ~1 min).
    rootDir: bot                     #   Upgrade to "starter" before the judged run for reliable healthz.
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn bot:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /v1/healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false                  # secret — enter this in the Render dashboard, never in git
      - key: TEAM_NAME
        value: "Vera Reforged"
      - key: TEAM_MEMBERS
        value: Irshad
      - key: CONTACT_EMAIL
        value: irshad.hussain.ug23@gmail.com
      - key: BOT_VERSION
        value: "1.0.0"
